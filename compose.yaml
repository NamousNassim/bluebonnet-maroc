# Local development database only: API and storefront run with `npm run` (see README.md).
name: bluebonnet-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bluebonnet
      POSTGRES_USER: bluebonnet
      POSTGRES_PASSWORD: bluebonnet-dev
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - dev_postgres:/var/lib/postgresql/data

volumes:
  dev_postgres:
